name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  # ──────────────────────────────────────────────
  # Windows: portable single .exe
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # 1. Build and package with electron-forge
      - run: npm run package
      # 2. Package the output with electron-builder into a portable .exe
      - run: npx electron-builder --win portable --prepackaged out/basalt-win32-x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-windows-portable
          path: dist/*.exe

  # ──────────────────────────────────────────────
  # Linux: AppImage
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # 1. Build and package with electron-forge
      - run: npm run package
      # 2. Package the output with electron-builder into an AppImage
      - run: npx electron-builder --linux AppImage --prepackaged out/basalt-linux-x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-linux-appimage
          path: dist/*.AppImage

  # ──────────────────────────────────────────────
  # Android: APK via Capacitor 8
  # ──────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      # electron-forge's package command also runs the Vite build,
      # which is what Capacitor needs
      - run: npm run package
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  # ──────────────────────────────────────────────
  # Release (only on version tags)
  # ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.apk
          generate_release_notes: true
