name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22

# Explicit least-privilege default. Individual jobs opt into more below.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Windows: portable single .exe
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npx electron-builder --win portable --prepackaged out/basalt-win32-x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-windows-portable
          path: dist/*.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Linux: AppImage
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npx electron-builder --linux AppImage --prepackaged out/basalt-linux-x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # macOS: DMG (Intel x64 — runs on Apple Silicon via Rosetta 2)
  #
  # We build on macos-13 (Intel) so the resulting .app runs natively
  # on Intel Macs and via Rosetta 2 on M1/M2/M3. If you'd rather have
  # a native ARM build, change the runner to macos-latest and the
  # --prepackaged path to out/basalt-darwin-arm64.
  #
  # No code signing cert is configured, so CSC_IDENTITY_AUTO_DISCOVERY
  # is disabled to keep electron-builder from trying (and failing) to
  # sign. Users will need to right-click → Open the first time.
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-13
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npx electron-builder --mac dmg --prepackaged out/basalt-darwin-x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Release (only on version tags like v1.0.0)
  # ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
